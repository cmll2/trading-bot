# trading-bot configuration. Loaded once, read-only, by bot/config.py into a frozen Settings.
# Exchange minimums and precision are NOT set here: they are read from the exchange's
# market metadata (CON-03; backtest: the recorded public snapshot in bot/backtest/). Fee
# rates: see `fees:` below. Secrets are NOT here: .env holds only the path to a
# secrets file outside the repository (SAF-01).

exchange:
  name: kraken

# ccxt unified symbols; a list, and v1 validation requires exactly one entry.
pairs:
  - BTC/EUR

fiat_currencies:
  - EUR

strategy:
  id: v0_trend
  timeframe: 1d
  # v0 parameters, fixed 2026-11-13 BEFORE any evaluation (FR-07), never tuned: long when
  # the last CLOSED daily close > SMA(sma_days) of daily closes, flat otherwise.
  params:
    sma_days: 200

capital:
  allocated_quote: "20"   # EUR the bot may use live (AD-26)

paper:
  initial_quote: "20"     # EUR seed of the dry-run virtual account

# Post-only limit at best bid/ask, re-priced within a window, then cancel & skip (AD-5).
execution:
  approval: manual                  # manual | autonomous (AD-16)
  window_hours: 6                   # after the daily close (00:00 UTC)
  reprice_interval_minutes: 30
  completion_window_hours: 24       # buy completion phase after the window (AD-28)
  sim_timeframe: 15m                # execution candles for fill simulation (AD-6)
  sim_half_spread_bps: "1"          # backtest bid/ask = last 15m close -/+ this (AD-6)
  tick_seconds: 30                  # engine tick; also the backtest order-placement lag
  fill_settle_timeout_seconds: 60   # cancel + fills must settle within this, else halt (AD-27)
  unknown_grace_seconds: 60         # an order of unknown outcome is looked up (open AND closed)
                                    # for this long before it counts as not_found (AD-8)
  # per-intent and daily submission caps are protected: see risk:

# Kraken's PUBLISHED entry-tier spot fees (schedule as of 2026-11), used by backtest and
# dry-run. The account's real tier can only be read with an authenticated call
# (fetch_trading_fee), forbidden during development: it is verified against these values
# at live startup (M6), which refuses to start if the API rates exceed them.
fees:
  maker: "0.0040"
  taker: "0.0080"
  source: published_schedule

slippage_bps: 5                     # configurable slippage assumption (CON-04)

backtest:
  # Fixed holdout window (UTC, inclusive), frozen; never moves (FR-15, FR-16).
  holdout_start: 2025-11-11
  holdout_end: 2026-11-10
  results_dir: results              # committed results + holdout_runs.jsonl (AD-21)
  lookahead_cutpoints: 12           # prefix-invariance reruns per backtest (AD-4)
  lookahead_seed: 20261113
  bootstrap_resamples: 2000         # Sharpe CI: moving-block bootstrap of daily returns
  bootstrap_block_days: 20
  bootstrap_seed: 20261113
  walk_forward_fold_days: 365       # consecutive out-of-sample folds before the holdout
  # After a protected halt (daily loss / total drawdown) the backtest models the operator's
  # manual reset at the next UTC daily close (SIMULATED RESET, labelled in every report);
  # a total-drawdown reset also rebases the baseline. "end_run" stops the run at a halt.
  simulated_halt_reset: next_daily_close

review:
  # GL-02 tolerances.
  gl02_max_fill_price_diff_fraction: "0.005"   # each paper fill within 0.5% of backtest price
  gl02_max_equity_diff_pp: "2"                 # 4-week equity within 2 percentage points

# Market data (AD-18): candles cached in var/data/BTC-EUR/{timeframe}.parquet.
data:
  timeframes: [1d, 4h, 15m]         # downloaded by `bot data update`
  fetch_max_retries: 5              # retries per request on rate limit / network errors
  fetch_retry_base_seconds: 2       # backoff = base * 2**attempt
  history_start: 2017-01-01         # provisional; re-measured in M1 story 6 (FR-03)
  no_trade_policy: fill_flat        # fill_flat | fail: archive omits no-trade intervals
  max_synthetic_ratio: "0.001"      # max synthetic rows / rows from history_start on
  max_synthetic_ratio_by_timeframe: # per-timeframe overrides (coordinator 2026-11-12)
    15m: "0.0025"                   # flat 15-min period = real no-trade state; measured 0.162% (audit M1 F-1)
  overlap_price_tolerance_ticks: 1  # archive vs API, same open_at: each of O,H,L,C (A-3)
  overlap_volume_tolerance_fraction: "0.01"  # and volume, relative to the larger one

paths:
  var_dir: var

# ---------------------------------------------------------------------------------------
# PROTECTED (SAF-04): change only on the operator's explicit request, in a commit that
# touches nothing else. Loaded read-only into bot.risk.limits.RiskLimits (frozen, SAF-05).
# ---------------------------------------------------------------------------------------
risk:
  max_position_fraction: "1.00"          # 100% of equity
  max_position_abs_quote: "25"           # and at most EUR 25
  # Operator request 2026-11-11: no strategy-limiting cap on trade count; these are
  # runaway-bug backstops only (a daily strategy produces at most one intent per day).
  max_order_intents_per_day: 20          # new order intents per UTC day
  max_exchange_submissions_per_day: 120  # exchange submissions per UTC day, re-prices included
  max_submissions_per_intent: 12         # submissions (first + re-prices) per order intent
  max_daily_loss_fraction: "0.10"        # halt, manual reset
  max_total_drawdown_fraction: "0.25"    # from the start baseline; halt, manual reset
  stale_candle_intervals: 2
  stale_ticker_seconds: 120
  price_sanity_fraction: "0.02"
  kill_switch_path: var/KILL             # resolved against this file's directory

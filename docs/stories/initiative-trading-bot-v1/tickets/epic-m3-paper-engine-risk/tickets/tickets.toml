covers = ["R9", "R10", "R11", "R18", "R19"]
after = [2, 4]
hitl = false
risk = "high"
refine = true
references = ["architecture — docs/planning/architecture.md, AD-11", "architecture — docs/planning/architecture.md, AD-12", "architecture — docs/planning/architecture.md, AD-17", "research — docs/planning/ux-dashboard/EXPERIENCE.md — Control boundary"]


# M3 stories in build order.

[[entry]]
id = 1
type = "story"
title = "Dry-run engine ticking on live prices with heartbeats and journal"
description = "Tracer: `bot dry-run --strategy v0_trend` runs Engine(PaperBroker, SystemClock, CcxtMarketData, var/state/dry-run-v0_trend.sqlite) with the engine lock, run record, per-tick heartbeat and a journaled signal on each daily close; `bot status` prints state."
verify = "FakeClock/fake-ccxt test drives one daily close to a journaled signal and a paper order; the builder runs `bot dry-run` for 10 minutes and `bot status` shows a fresh heartbeat (labelled simulated)."
covers = ["R3", "R4", "R5", "R12"]
after = ["epic-m2-backtest"]
hitl = false
risk = "medium"
refine = true
references = ["architecture — docs/planning/architecture.md, AD-1", "architecture — docs/planning/architecture.md, AD-2", "architecture — docs/planning/architecture.md, AD-17", "architecture — docs/planning/architecture.md, AD-26", "architecture — docs/planning/architecture.md, AD-28"]


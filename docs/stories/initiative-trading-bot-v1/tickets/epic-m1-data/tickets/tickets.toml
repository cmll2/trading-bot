# M1 stories in build order.

[[entry]]
id = 1
type = "story"
title = "Recent daily candles downloaded, cached and validated end to end"
description = "Tracer: `bot data update` pulls recent BTC/EUR 1d candles via ccxt with pagination and rate-limit handling into var/data/BTC-EUR/1d.parquet, and `bot data validate` checks them."
verify = "With a fake ccxt in tests the cache file is written with the schema; run once for real by the builder, `bot data validate` exits 0 and prints the range."
covers = ["R1", "R2"]
after = ["epic-m0-scaffold"]
hitl = false
risk = "low"
refine = true
references = ["architecture — docs/planning/architecture.md, AD-18", "architecture — docs/planning/architecture.md, AD-24", "architecture — docs/planning/architecture.md, Consistency conventions: Time, Pairs"]

[[entry]]
id = 2
type = "story"
title = "Validation fails loudly and never repairs"
description = "data/validate.py checks uniqueness, monotonic and interval-aligned UTC timestamps and OHLC consistency, classifies missing intervals, and applies the no-trade policy."
verify = "Fixture tests: each defect type makes `bot data validate` exit non-zero naming the defect; a no-trade gap inside the archive range is filled flat with source=synthetic under `fill_flat`, and fails under `fail`."
covers = ["R3"]
after = [1]
hitl = false
risk = "medium"
refine = true
references = ["architecture — docs/planning/architecture.md, AD-18"]

[[entry]]

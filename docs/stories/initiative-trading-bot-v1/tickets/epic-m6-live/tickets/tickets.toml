# M6 stories in build order.

[[entry]]
id = 1
type = "story"
title = "KrakenBroker adapter tested against a fake ccxt"
description = "bot/broker/kraken.py implements the Broker port on ccxt.kraken with clientOrderId, postOnly and oflags=fciq, find_order over open and closed orders, fee rates from fetch_trading_fee, and error mapping to the taxonomy."
verify = "Unit tests with an injected fake ccxt check outgoing order params, find_order lookups, post-only crossing in both forms, minimum/tick errors and fail-closed fees; no network."
covers = ["R1", "R2", "R3"]
after = ["epic-m5-dry-run"]
hitl = false
risk = "high"
refine = true
references = ["architecture — docs/planning/architecture.md, §1 KrakenBroker", "architecture — docs/planning/architecture.md, AD-8", "architecture — docs/planning/architecture.md, AD-13", "architecture — docs/planning/architecture.md, AD-15", "architecture — docs/planning/architecture.md, AD-27"]

[[entry]]

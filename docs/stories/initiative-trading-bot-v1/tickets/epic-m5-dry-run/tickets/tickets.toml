# M5 stories in build order.

[[entry]]
id = 1
type = "story"
title = "Start the four-week dry-run on frozen code"
description = "The operator starts v0 and plumbing dry-runs under Task Scheduler on a tagged commit, with config and limits hashes, review backtest ref and start date recorded."
verify = "PROGRESS.md records the start UTC, commit, config_hash, limits_hash, review.backtest_run_ref and the incident rule; `bot status` shows both engines running."
covers = ["R1", "R2"]
after = ["epic-m4-dashboard"]
hitl = true
risk = "medium"
refine = true
references = ["architecture — docs/planning/architecture.md, AD-21", "architecture — docs/planning/architecture.md, AD-29", "decisions — PROGRESS.md, dry-run host, GL-02 tolerance"]


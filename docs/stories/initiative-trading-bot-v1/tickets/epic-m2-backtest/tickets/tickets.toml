# M2 stories in build order.

[[entry]]
id = 1
type = "story"
title = "Broker port, domain types, error taxonomy and FakeBroker"
description = "bot/broker/base.py and errors.py define the Broker protocol, frozen Decimal/UTC domain types and the six-error taxonomy; tests/fakes provide a scriptable FakeBroker."
verify = "Unit tests: FakeBroker satisfies the protocol, scripts partial fill, timeout-after-accept, reject, rate limit and exchange-side cancel, and place_order raises without an approved matching RiskDecision."
covers = ["R17"]
after = ["epic-m1-data"]
hitl = false
risk = "medium"
refine = true
references = ["architecture — docs/planning/architecture.md, §1 Broker port", "architecture — docs/planning/architecture.md, AD-10"]


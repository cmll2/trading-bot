# M4 stories in build order.

[[entry]]
id = 1
type = "story"
title = "Dashboard shell on 127.0.0.1 with mode banner and status strip"
description = "Tracer: `bot dashboard` starts Streamlit bound to 127.0.0.1, opens the store with mode=ro, shows the mode banner from the latest run, the status strip and a minimal Overview (equity, cash, last heartbeat)."
verify = "Test asserts .streamlit/config.toml and the CLI flags set server.address=127.0.0.1, headless and no usage stats; the builder opens it against the M3 store and sees the DRY-RUN banner."
covers = ["R7", "R16", "R17"]
after = ["epic-m3-paper-engine-risk"]
hitl = false
risk = "medium"
refine = true
references = ["architecture — docs/planning/architecture.md, AD-17", "architecture — docs/planning/architecture.md, AD-23", "design — docs/planning/ux-dashboard/EXPERIENCE.md, DESIGN.md"]

[[entry]]
id = 2
type = "story"
title = "Risk page with kill-switch engage"
description = "Risk view: each limit with usage from risk_snapshots, rejection/halt/kill history, kill-switch state, and an Engage button with confirmation that calls risk.kill_switch.engage."
verify = "Test: clicking Engage then confirming creates the kill file with source=dashboard and the engine (FakeBroker) halts on next tick; no disengage control exists; usage values come from risk_snapshots."
covers = ["R11", "R15"]
after = [1]
hitl = false
risk = "high"
refine = true
references = ["architecture — docs/planning/architecture.md, AD-12", "architecture — docs/planning/architecture.md, AD-17", "design — docs/planning/ux-dashboard/EXPERIENCE.md Risk, Kill switch button"]


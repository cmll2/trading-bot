[project]
name = "trading-bot"
version = "0.1.0"
description = "Small-capital rules-based Kraken spot trading bot with dry-run dashboard"
authors = [{ name = "Camille Hascoët" }]
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.92",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
]

[project.scripts]
bot = "bot.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bot"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored agent tooling, not project code.
extend-exclude = [".agents", ".claude", "_bmad"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "TID"]
ignore = ["S101"]  # assert is fine in tests

# AD-2: only bot/clock.py may read wall-clock time.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "use the Clock port (bot/clock.py), AD-2"
"datetime.datetime.utcnow".msg = "use the Clock port (bot/clock.py), AD-2"
"datetime.date.today".msg = "use the Clock port (bot/clock.py), AD-2"
"time.time".msg = "use the Clock port (bot/clock.py), AD-2"
"time.time_ns".msg = "use the Clock port (bot/clock.py), AD-2"
"time.sleep".msg = "use the Clock port (bot/clock.py), AD-2"

[tool.ruff.lint.per-file-ignores]
"bot/clock.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
